[project]
name = "emailtool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imap-tools>=1.16.0",
    "prompt-toolkit>=3.0.53",
    "pydantic-ai>=2.64.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
emailtool = "emailtool.main:main"
cli = "emailtool.main:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
